<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save the Date • Renata Carvalho XV</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Great+Vibes&family=Pinyon+Script&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5edff;
      --paper-2: #ede0f7;
      --lilac-soft: #d4bef0;
      --lilac: #b794d4;
      --lilac-mid: #6b4a9e;
      --lilac-deep: #4a2d7a;
      --lilac-ink: #2d1b4e;
      --silver-ink: #3d2862;
      --rose-soft: #f5c4e8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100vh; overflow-x: hidden; }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(212,190,240,.4), transparent 35%),
        radial-gradient(ellipse at 85% 90%, rgba(245,196,232,.25), transparent 35%),
        radial-gradient(ellipse at 50% 50%, rgba(237,224,247,.5), transparent 60%),
        linear-gradient(160deg, #f5edff 0%, #ede0f7 50%, #f0e4f8 100%);
      color: var(--lilac-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
    }

    /* Paper texture overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 25% 25%, rgba(255,255,255,.4) 1px, transparent 2px),
        radial-gradient(circle at 75% 75%, rgba(157,123,200,.05) 1px, transparent 2px);
      background-size: 4px 4px, 6px 6px;
      opacity: 0.6;
      mix-blend-mode: overlay;
      z-index: 0;
    }

    #sparkleCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

    .corner-flowers {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      filter: drop-shadow(0 4px 12px rgba(124,92,163,.12));
    }
    .corner-tr { top: -10px; right: -10px; transform: rotate(15deg); }
    .corner-bl { bottom: -10px; left: -10px; transform: rotate(195deg); }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
      padding: 3.5rem 2rem;
      text-align: center;
      animation: fadeUp 1.2s ease forwards;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .save-script {
      font-family: 'Pinyon Script', 'Great Vibes', cursive;
      font-size: clamp(2.6rem, 8.5vw, 3.8rem);
      color: #2d1b4e;
      line-height: 1;
      text-shadow: 0 1px 0 #2d1b4e, 0 2px 4px rgba(124,92,163,.15);
    }

    .save-date {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(1.15rem, 3.5vw, 1.45rem);
      color: #3d2862;
      letter-spacing: 0.18em;
      margin-top: 0.3rem;
    }

    .wreath-wrap {
      position: relative;
      margin: 2rem auto 1rem;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1;
    }

    .wreath-wrap svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 6px 20px rgba(124,92,163,.15));
    }

    .name-cursive {
      font-family: 'Pinyon Script', 'Great Vibes', cursive;
      font-size: clamp(2.6rem, 8.5vw, 3.6rem);
      color: #2d1b4e;
      line-height: 1;
      margin-top: 0.5rem;
      text-shadow: 0 1px 0 #2d1b4e, 0 2px 6px rgba(124,92,163,.2);
    }

    .xv-roman {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(2.1rem, 6vw, 2.9rem);
      color: #3d2862;
      letter-spacing: 0.45em;
      margin-top: 0.3rem;
      padding-left: 0.45em;
    }

    .open-btn {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 0.85rem 2.25rem;
      background: linear-gradient(135deg, #c9b0e8, #b794d4, #a37dcf);
      border: 1px solid rgba(124,92,163,.3);
      border-radius: 9999px;
      color: white;
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(124,92,163,.25), inset 0 1px 2px rgba(255,255,255,.4);
      transition: all 0.35s ease;
    }

    .open-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(124,92,163,.35);
    }

    .tap-hint {
      margin-top: 1.25rem;
      font-style: italic;
      font-size: 0.95rem;
      color: #3d2862;
      font-weight: 500;
    }

    .divider-deco {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin: 0.75rem auto 0;
    }

    .divider-deco .line {
      flex: 1;
      max-width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--lilac-mid), transparent);
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1rem; }
      .wreath-wrap { max-width: 340px; }
      .corner-flowers svg { width: 140px !important; height: 140px !important; }
    }
  </style>
</head>
<body>

<canvas id="sparkleCanvas"></canvas>

<!-- ═══ SVG DEFINITIONS (shared) ═══ -->
<svg width="0" height="0" style="position:absolute;">
  <defs>
    <radialGradient id="petalLilac" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#f0d9f5"/>
      <stop offset="60%" stop-color="#c9a4e0"/>
      <stop offset="100%" stop-color="#9d7bc8"/>
    </radialGradient>
    <radialGradient id="petalLilacLight" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#faeefb"/>
      <stop offset="60%" stop-color="#dec5ea"/>
      <stop offset="100%" stop-color="#b794d4"/>
    </radialGradient>
    <radialGradient id="petalRose" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="60%" stop-color="#f5c4e8"/>
      <stop offset="100%" stop-color="#d8a5d0"/>
    </radialGradient>
    <radialGradient id="petalWhite" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f7f0fa"/>
      <stop offset="100%" stop-color="#e2d3ec"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4d9b8"/>
      <stop offset="50%" stop-color="#a3c08e"/>
      <stop offset="100%" stop-color="#7a9b6a"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8cdb0"/>
      <stop offset="100%" stop-color="#85a878"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9b6dd"/>
      <stop offset="50%" stop-color="#a896c0"/>
      <stop offset="100%" stop-color="#7e6996"/>
    </linearGradient>

    <g id="rose">
      <ellipse cx="0" cy="-12" rx="11" ry="14" fill="url(#petalLilac)" opacity="0.95"/>
      <ellipse cx="0" cy="-12" rx="11" ry="14" fill="url(#petalLilac)" opacity="0.95" transform="rotate(72)"/>
      <ellipse cx="0" cy="-12" rx="11" ry="14" fill="url(#petalLilac)" opacity="0.95" transform="rotate(144)"/>
      <ellipse cx="0" cy="-12" rx="11" ry="14" fill="url(#petalLilac)" opacity="0.95" transform="rotate(216)"/>
      <ellipse cx="0" cy="-12" rx="11" ry="14" fill="url(#petalLilac)" opacity="0.95" transform="rotate(288)"/>

      <circle r="2" fill="#5a3f87" opacity="0.5"/>
    </g>
    <g id="roseLight">
      <ellipse cx="0" cy="-10" rx="9" ry="12" fill="url(#petalLilacLight)" opacity="0.95"/>
      <ellipse cx="0" cy="-10" rx="9" ry="12" fill="url(#petalLilacLight)" opacity="0.95" transform="rotate(72)"/>
      <ellipse cx="0" cy="-10" rx="9" ry="12" fill="url(#petalLilacLight)" opacity="0.95" transform="rotate(144)"/>

      <ellipse cx="0" cy="-9" rx="8" ry="11" fill="url(#petalWhite)" opacity="0.97" transform="rotate(144)"/>

      <ellipse cx="0" cy="-5" rx="3.5" ry="5" fill="#c9a4e0" transform="rotate(72)"/>
      <ellipse cx="0" cy="-5" rx="3.5" ry="5" fill="#c9a4e0" transform="rotate(144)"/>
      <ellipse cx="0" cy="-5" rx="3.5" ry="5" fill="#c9a4e0" transform="rotate(216)"/>
      <ellipse cx="0" cy="-5" rx="3.5" ry="5" fill="#c9a4e0" transform="rotate(288)"/>
      <circle r="2" fill="#7c5ca3"/>
    </g>
    <g id="leaf">
      <path d="M0 0 Q -8 -8 -12 -22 Q -8 -28 0 -30 Q 8 -28 12 -22 Q 8 -8 0 0 Z" fill="url(#leafGrad)" opacity="0.92"/>
      <path d="M0 0 L0 -28" stroke="#658c5a" stroke-width="0.6" opacity="0.6"/>
    </g>
    <g id="leafSmall">
      <path d="M0 0 Q -5 -6 -8 -16 Q -5 -20 0 -22 Q 5 -20 8 -16 Q 5 -6 0 0 Z" fill="url(#leafGrad2)" opacity="0.9"/>
      <path d="M0 0 L0 -20" stroke="#658c5a" stroke-width="0.5" opacity="0.5"/>
    </g>
    <g id="bud">
      <ellipse cx="0" cy="-6" rx="4" ry="6" fill="url(#petalLilac)"/>
      <path d="M-4 -3 Q -6 4 -3 8 M4 -3 Q 6 4 3 8 M0 -1 Q 0 6 0 10" stroke="url(#leafGrad)" stroke-width="2.5" fill="none" opacity="0.85"/>

    <g id="cornerCluster">
      <g transform="translate(40 50) rotate(-30)"><use href="#leaf"/></g>
      <g transform="translate(70 30) rotate(20)"><use href="#leaf"/></g>
      <g transform="translate(90 60) rotate(-15)"><use href="#leaf"/></g>
      <g transform="translate(115 90) rotate(40)"><use href="#leaf"/></g>
      <g transform="translate(60 90) rotate(-50)"><use href="#leafSmall"/></g>
      <g transform="translate(140 50) rotate(60)"><use href="#leafSmall"/></g>
      <g transform="translate(80 70)"><use href="#rose"/></g>
      <g transform="translate(120 50) scale(0.85)"><use href="#roseLight"/></g>
      <g transform="translate(50 100) scale(0.8)"><use href="#roseWhite"/></g>
      <g transform="translate(110 100) scale(0.7)"><use href="#roseLight"/></g>
      <g transform="translate(95 30) scale(0.9)"><use href="#smallFlower"/></g>
      <g transform="translate(140 80) scale(0.85)"><use href="#smallFlowerPurple"/></g>
      <g transform="translate(35 75) scale(0.9)"><use href="#smallFlower"/></g>
      <g transform="translate(150 30) rotate(30)"><use href="#bud"/></g>
      <g transform="translate(25 105) rotate(-60)"><use href="#bud"/></g>
    </g>
  </defs>
</svg>

<!-- Corner flowers -->
<div class="corner-flowers corner-tr">
  <svg width="200" height="200" viewBox="0 0 200 200" fill="none"><use href="#cornerCluster"/></svg>
</div>
<div class="corner-flowers corner-bl">
  <svg width="200" height="200" viewBox="0 0 200 200" fill="none"><use href="#cornerCluster"/></svg>
</div>

<!-- ═══ MAIN CARD ═══ -->
<div class="card">
  <p class="save-script">Save the Date</p>
  <p class="save-date">26 · 09 · 2026</p>

  <div class="wreath-wrap">
    <svg viewBox="0 0 420 420" fill="none" xmlns="http://www.w3.org/2000/svg">

      <circle cx="210" cy="210" r="155" stroke="url(#crownGrad)" stroke-width="1.2" fill="none" opacity="0.7"/>
      <circle cx="210" cy="210" r="148" stroke="url(#crownGrad)" stroke-width="0.6" fill="none" opacity="0.5"/>

      <!-- TOP-LEFT arc -->
      <g transform="translate(75 145) rotate(-65)"><use href="#leaf"/></g>

      <g transform="translate(140 75) rotate(-15)"><use href="#leaf"/></g>
      <g transform="translate(180 60) rotate(5)"><use href="#leaf"/></g>
      <g transform="translate(115 130) rotate(-55)"><use href="#leafSmall"/></g>
      <g transform="translate(155 95) rotate(-25)"><use href="#leafSmall"/></g>
      <g transform="translate(85 175) rotate(-85)"><use href="#leafSmall"/></g>

      <g transform="translate(125 95)"><use href="#rose"/></g>
      <g transform="translate(165 75) scale(0.85)"><use href="#roseLight"/></g>
      <g transform="translate(95 130) scale(0.9)"><use href="#roseWhite"/></g>
      <g transform="translate(80 165) scale(0.78)"><use href="#rose"/></g>
      <g transform="translate(195 60) scale(0.7)"><use href="#roseLight"/></g>

      <g transform="translate(150 110) scale(0.9)"><use href="#smallFlower"/></g>
      <g transform="translate(110 165) scale(0.85)"><use href="#smallFlowerPurple"/></g>
      <g transform="translate(180 95) scale(0.75)"><use href="#smallFlowerPurple"/></g>
      <g transform="translate(65 200) scale(0.8)"><use href="#smallFlower"/></g>

      <g transform="translate(215 50) rotate(20)"><use href="#bud"/></g>
      <g transform="translate(55 235) rotate(-110)"><use href="#bud"/></g>

      <!-- BOTTOM-RIGHT arc -->
      <g transform="translate(345 275) rotate(115)"><use href="#leaf"/></g>
      <g transform="translate(320 315) rotate(140)"><use href="#leaf"/></g>
      <g transform="translate(280 345) rotate(165)"><use href="#leaf"/></g>
      <g transform="translate(240 360) rotate(185)"><use href="#leaf"/></g>
      <g transform="translate(305 290) rotate(125)"><use href="#leafSmall"/></g>
      <g transform="translate(265 325) rotate(155)"><use href="#leafSmall"/></g>
      <g transform="translate(335 245) rotate(95)"><use href="#leafSmall"/></g>

      <g transform="translate(295 325)"><use href="#rose"/></g>
      <g transform="translate(255 345) scale(0.85)"><use href="#roseLight"/></g>
      <g transform="translate(325 290) scale(0.9)"><use href="#roseWhite"/></g>
      <g transform="translate(340 255) scale(0.78)"><use href="#rose"/></g>

      <g transform="translate(270 310) scale(0.9)"><use href="#smallFlower"/></g>

      <g transform="translate(205 370) rotate(200)"><use href="#bud"/></g>
      <g transform="translate(365 185) rotate(70)"><use href="#bud"/></g>

      <!-- CROWN above monogram -->
      <g transform="translate(210 145)">
        <path d="M-30 0 L-30 -18 L-18 -32 L-8 -18 L0 -38 L8 -18 L18 -32 L30 -18 L30 0 Z"
              fill="url(#crownGrad)" opacity="0.85"/>
        <rect x="-30" y="-4" width="60" height="8" rx="4" fill="url(#crownGrad)" opacity="0.8"/>
        <circle cx="0" cy="-36" r="3" fill="#9d7bc8"/>
        <circle cx="-18" cy="-30" r="2" fill="#c9a4e0"/>
        <circle cx="18" cy="-30" r="2" fill="#c9a4e0"/>
        <circle cx="-30" cy="-15" r="1.5" fill="#b794d4"/>
        <circle cx="30" cy="-15" r="1.5" fill="#b794d4"/>
      </g>

      <!-- MONOGRAM "RC" -->
      <text x="190" y="255" font-family="'Pinyon Script', 'Great Vibes', cursive" font-size="140" fill="#7c5ca3" stroke="#5a3f87" stroke-width="0.5" text-anchor="middle">R</text>

    </svg>
  </div>

  <h1 class="name-cursive">Renata Carvalho</h1>
  <p class="xv-roman">XV</p>

  <div class="divider-deco">
    <span class="line"></span>
    <svg width="16" height="14" viewBox="0 0 16 14" fill="none">
      <path d="M8 13 L1 6 Q 1 1 5 1 Q 8 1 8 4 Q 8 1 11 1 Q 15 1 15 6 Z" fill="#b794d4" opacity="0.7"/>
    </svg>
    <span class="line"></span>
  </div>

  <a href="convite.html" class="open-btn">Abrir convite</a>
  <p class="tap-hint">Tema Euphoria · Lilás & Brilho</p>
</div>

<script>
  const canvas = document.getElementById('sparkleCanvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const colors = ['#d4bef0','#b794d4','#f5c4e8','#ffffff','#c9a4e0','#e2d3ec'];
  const particles = [];

  for (let i=0; i<60; i++){
    particles.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.4 + 0.3,
      color: colors[Math.floor(Math.random()*colors.length)],
      sp: Math.random()*0.25 + 0.05,
      op: Math.random()*0.6 + 0.2,
      ts: Math.random()*0.015 + 0.004,
      td: Math.random()>0.5?1:-1,
      dir: Math.random()*Math.PI*2
    });
  }

  function drawSparkle(ctx, x, y, size, op, color){
    ctx.save();
    ctx.globalAlpha = op;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(size*0.25, -size*0.25);
    ctx.lineTo(size, 0);
    ctx.lineTo(size*0.25, size*0.25);
    ctx.lineTo(0, size);
    ctx.lineTo(-size*0.25, size*0.25);
    ctx.lineTo(-size, 0);
    ctx.lineTo(-size*0.25, -size*0.25);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  const sparkles = [];
  for (let i=0; i<15; i++){
    sparkles.push({
      x: Math.random()*W, y: Math.random()*H,
      size: Math.random()*4 + 2,
      color: colors[Math.floor(Math.random()*colors.length)],
      op: Math.random()*0.5 + 0.2,
      ts: Math.random()*0.02 + 0.008,
      td: Math.random()>0.5?1:-1,
      sp: Math.random()*0.15 + 0.03
    });
  }

  function animate(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{
      p.op += p.ts*p.td;
      if (p.op >= 0.8 || p.op <= 0.05) p.td *= -1;
      p.y -= p.sp*0.3;
      p.x += Math.sin(p.dir + p.y*0.005)*0.2;
      if (p.y < -5){ p.y = H+5; p.x = Math.random()*W; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.op);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
    sparkles.forEach(s=>{
      s.op += s.ts*s.td;
      if (s.op >= 0.7 || s.op <= 0.05) s.td *= -1;
      s.y -= s.sp*0.2;
      if (s.y < -10){ s.y = H+10; s.x = Math.random()*W; }
      drawSparkle(ctx, s.x, s.y, s.size, Math.max(0,s.op), s.color);
    });
    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
